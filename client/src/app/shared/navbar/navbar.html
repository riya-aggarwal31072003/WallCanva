<nav class="nav">
  <a class="brand" routerLink="/dashboard">WallCanva</a>

  <div class="links">
    @if (auth.isLoggedIn()) {
      <a routerLink="/dashboard" routerLinkActive="active">My Designs</a>
      <a routerLink="/upload" routerLinkActive="active">New Design</a>
      <a routerLink="/feedback" routerLinkActive="active">Feedback</a>
      <a routerLink="/help" routerLinkActive="active">How to use</a>
      @if (auth.isAdmin()) {
        <a routerLink="/admin/dashboard" routerLinkActive="active">Analytics</a>
        <a routerLink="/admin/colors" routerLinkActive="active">Colours</a>
        <a routerLink="/admin/users" routerLinkActive="active">Users</a>
      }
      <span class="user">{{ auth.user()?.name }}</span>
      <button type="button" (click)="auth.logout()">Logout</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Login</a>
      <a routerLink="/register" routerLinkActive="active">Register</a>
    }
  </div>
</nav>
